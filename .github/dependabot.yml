# Keeps pinned GitHub Actions, Go modules and the build image current without a
# flood of pull requests (the first run, with no grouping, opened eleven):
#
#  - Minor and patch updates of one ecosystem arrive as ONE pull request.
#  - Major updates stay separate, so each gets a deliberate look.
#  - The etcd api and client modules always move together; api 3.7 does not
#    compile against client 3.6.
#  - The Google Cloud client libraries are a group of their own (see below).
#  - A new release waits a week before it is proposed. Security updates ignore
#    this delay.
#  - The Go image stays on the Go version declared in go.mod; move both by hand
#    when the project is ready for a new Go release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      etcd:
        patterns: ["go.etcd.io/etcd/*"]
      # Authentication and transport of the real Spanner connection. The
      # emulator-based CI cannot exercise them, so these updates get their own
      # pull request and are merged only after the real-Spanner test run
      # described in docs/development.md. A dependency goes to the first group
      # it matches, so this one must stay above go-minor-and-patch.
      google-cloud:
        patterns:
          - "cloud.google.com/go*"
          - "google.golang.org/api"
          - "google.golang.org/grpc"
          - "google.golang.org/genproto*"
        update-types: [minor, patch]
      go-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["go.etcd.io/etcd/*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

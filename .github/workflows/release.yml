name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # The same checks as for a pull request (vet, govulncheck, tests with -race,
  # no skipped tests). Nothing below runs unless they pass, so a tag on a commit
  # that was never tested, or a red one, publishes nothing.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build binaries
        run: make build-linux

      - name: vendor dependencies
        run: make vendor

      - name: log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build and push docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # A tag with a suffix (v0.3.0-rc.1) is a pre-release: it gets its own image
          # tag but never moves :latest, so trying a release candidate cannot change
          # what everyone who follows :latest runs. (An empty line is ignored.)
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}:latest', github.repository) || '' }}

      - name: extract changelog
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          # Extract section from CHANGELOG.md between current and next version header
          BODY=$(awk "/^## ${VERSION}/{found=1; next} found && /^## v[0-9]/{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="See [CHANGELOG.md](CHANGELOG.md) for details."
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: create github release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Pre-releases are marked as such and never become the "latest" release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            spanner-etcd-linux-amd64
            spanner-etcd-migrate-linux-amd64

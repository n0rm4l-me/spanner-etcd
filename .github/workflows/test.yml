name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by the release workflow, so a tag cannot publish untested code.
  workflow_call:

# Read-only by default; no job here needs more.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit bash adds -o pipefail. Without it a failing `go test ... | tee` step
# reports the exit status of tee, so a red test would not fail the job.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      # Fails on a vulnerability the code actually reaches (not on one that is
      # merely present in a dependency). Update the dependency or the Go version.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      # -race needs cgo, which the runner has. It slows the suite down several
      # times, hence the generous per-package timeout.
      - name: test
        run: go test ./... -race -timeout=10m -count=1 -v 2>&1 | tee /tmp/test-output.txt
        env:
          SPANNER_EMULATOR_HOST: localhost:9010

      # The emulator tests skip silently when the emulator is unreachable, which
      # would turn a broken service container into a green run.
      - name: no skipped tests
        run: |
          skipped=$(grep -cE '^\s*--- SKIP' /tmp/test-output.txt || true)
          echo "skipped tests: $skipped"
          test "$skipped" -eq 0

      - name: summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(--- PASS|--- FAIL|--- SKIP|FAIL|ok )" /tmp/test-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'

    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
          - 9020:9020

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: bench
        run: |
          go test ./bench/... -bench=. -benchtime=5s -benchmem -timeout=300s \
            2>&1 | tee /tmp/bench-output.txt
        env:
          SPANNER_EMULATOR_HOST: localhost:9010

      - name: summary
        if: always()
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(Benchmark|PASS|FAIL|ok )" /tmp/bench-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: /tmp/bench-output.txt
          retention-days: 30
